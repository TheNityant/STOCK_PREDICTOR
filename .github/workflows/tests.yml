name: Validate notebook project
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - name: Notebook JSON verification
        run: python -c "import nbformat; nb=nbformat.read('notebooks/01_hk_sentiment_forecasting.ipynb',as_version=4);nbformat.validate(nb);print(len(nb.cells),'cells OK')"
